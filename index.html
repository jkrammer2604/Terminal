<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Linux Terminal</title>
    <!-- Supabase JS Client per CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #00ff66;
            margin-right: 8px;
            white-space: nowrap;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal">Verbinde mit Supabase Backend...
</div>

    <div class="input-line">
        <span class="prompt" id="prompt-label">login:</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        // --- HIER DEINE SUPABASE DATEN EINTRAGEN ---
        const SUPABASE_URL = 'https://fyklknvrahzaqeksiosq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A3FfZHSipqUHb74clLXjeg_VDhqeu12';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const promptLabel = document.getElementById('prompt-label');

        let currentUser = null;
        let authState = "LOGIN_USER"; // LOGIN_USER, LOGIN_PASS, NORMAL
        let tempUser = "";
        let currentPath = [];

        async function initTerminal() {
            const { error } = await supabaseClient.from('users').select('id').limit(1);
            if (error) {
                terminal.innerHTML += `Fehler: Konnte nicht auf Supabase zugreifen (${error.message}).\n`;
            } else {
                terminal.innerHTML += `Verbindung zu Supabase erfolgreich!\n`;
            }
            terminal.innerHTML += `Standard-Logins: 'root' (Passwort: secret) oder 'guest' (Passwort: guest123)\n\n`;
            updatePrompt();
        }
        initTerminal();

        function getPathString() {
            if (currentPath.length === 0) return "~";
            return "~/" + currentPath.join("/");
        }

        function updatePrompt() {
            if (!currentUser) {
                promptLabel.innerText = authState === "LOGIN_PASS" ? "Password:" : "login:";
            } else {
                const symbol = currentUser === 'root' ? '#' : '$';
                promptLabel.innerText = `${currentUser}@linux-box:${getPathString()}${symbol}`;
            }
        }

        commandInput.addEventListener('keydown', async function(event) {
            if (event.key === 'Enter') {
                const inputVal = commandInput.value.trim();

                // 1. Login Ablauf
                if (!currentUser) {
                    if (authState === "LOGIN_USER") {
                        tempUser = inputVal;
                        terminal.innerHTML += `login: ${tempUser}\n`;
                        if (tempUser) {
                            authState = "LOGIN_PASS";
                        }
                    } else if (authState === "LOGIN_PASS") {
                        terminal.innerHTML += `Password: ****\n`;
                        // Benutzer in Supabase prüfen
                        const { data, error } = await supabaseClient
                            .from('users')
                            .select('*')
                            .eq('username', tempUser)
                            .single();

                        if (data && data.password === inputVal) {
                            currentUser = data.username;
                            currentPath = [currentUser];
                            authState = "NORMAL";
                            terminal.innerHTML += `Willkommen, ${currentUser}!\nTippe 'help' für Befehle.\n`;
                        } else {
                            terminal.innerHTML += `Login incorrect\n`;
                            authState = "LOGIN_USER";
                        }
                        tempUser = "";
                    }
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                // 2. Normaler Terminal-Modus
                if (inputVal === "") return;
                const symbol = currentUser === 'root' ? '#' : '$';
                terminal.innerHTML += `\n${currentUser}@linux-box:${getPathString()}${symbol} ${inputVal}\n`;

                const parts = inputVal.split(' ');
                const cmd = parts[0];
                const args = parts.slice(1);

                await executeDbCommand(cmd, args);

                commandInput.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        // Befehle mit Supabase-Verknüpfung ausführen
        async function executeDbCommand(cmd, args) {
            const fullPath = currentPath.join('/');

            switch (cmd) {
                case 'help':
                    terminal.innerHTML += `Verfügbare Befehle:\n` +
                                          `  help              - Zeigt Hilfe\n` +
                                          `  ls                - Dateien anzeigen (aus DB)\n` +
                                          `  touch <datei>     - Datei erstellen (in DB)\n` +
                                          `  cat <datei>       - Datei lesen (aus DB)\n` +
                                          `  whoami            - Aktueller Nutzer\n` +
                                          `  exit              - Abmelden\n` +
                                          `  clear             - Bildschirm leeren\n`;
                    break;

                case 'ls':
                    const { data: files, error } = await supabaseClient
                        .from('terminal_files')
                        .select('name')
                        .eq('path', fullPath);

                    if (error) {
                        terminal.innerHTML += `Fehler beim Laden: ${error.message}\n`;
                    } else {
                        const fileNames = files.map(f => f.name).join('  ');
                        terminal.innerHTML += fileNames + '\n';
                    }
                    break;

                case 'touch':
                    if (args.length === 0) {
                        terminal.innerHTML += `touch: Dateiname fehlt\n`;
                        return;
                    }
                    const fileName = args[0];
                    const { error: insertError } = await supabaseClient
                        .from('terminal_files')
                        .insert([{ path: fullPath, name: fileName, type: 'file', content: '' }]);

                    if (insertError) {
                        terminal.innerHTML += `Fehler: ${insertError.message}\n`;
                    } else {
                        terminal.innerHTML += `Datei '${fileName}' in Supabase erstellt.\n`;
                    }
                    break;

                case 'cat':
                    if (args.length === 0) {
                        terminal.innerHTML += `cat: Dateiname fehlt\n`;
                        return;
                    }
                    const targetFile = args[0];
                    const { data: fileData, error: readError } = await supabaseClient
                        .from('terminal_files')
                        .select('content')
                        .eq('path', fullPath)
                        .eq('name', targetFile)
                        .single();

                    if (readError || !fileData) {
                        terminal.innerHTML += `cat: ${targetFile}: Datei nicht gefunden\n`;
                    } else {
                        terminal.innerHTML += (fileData.content || '') + '\n';
                    }
                    break;

                case 'whoami':
                    terminal.innerHTML += `${currentUser}\n`;
                    break;

                case 'exit':
                    currentUser = null;
                    authState = "LOGIN_USER";
                    terminal.innerHTML += `Abgemeldet.\n`;
                    updatePrompt();
                    break;

                case 'clear':
                    terminal.innerHTML = '';
                    break;

                default:
                    terminal.innerHTML += `bash: ${cmd}: Befehl nicht gefunden\n`;
            }
        }

        document.addEventListener('click', () => {
            commandInput.focus();
        });
    </script>
</body>
</html>
