<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erweitertes Linux Terminal</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #00ff66;
            margin-right: 8px;
            white-space: nowrap;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal">System gestartet. V2.6
Standard-Logins: 'root' (Passwort: secret) oder 'guest' (Passwort: guest123)
</div>

    <div class="input-line">
        <span class="prompt" id="prompt-label">login:</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const promptLabel = document.getElementById('prompt-label');

        const users = {
            "root": { pass: "secret", home: ["root"], sudo: true },
            "guest": { pass: "guest123", home: ["home", "guest"], sudo: false }
        };

        let currentUser = null;
        let authState = "LOGIN_USER"; // LOGIN_USER, LOGIN_PASS, SUDO_PASS, PASSWD_NEW
        let tempUser = "";
        let pendingSudoCmd = "";

        // Virtuelles Dateisystem (Baumstruktur)
        const fileSystem = {
            type: "dir",
            content: {
                "home": {
                    type: "dir",
                    content: {
                        "guest": {
                            type: "dir",
                            content: {
                                "willkommen.txt": { type: "file", content: "Hallo! Du bist als Gast eingeloggt." }
                            }
                        }
                    }
                },
                "root": {
                    type: "dir",
                    content: {
                        "geheimes_flag.txt": { type: "file", content: "FLAG{terminal_pro_2026}" }
                    }
                }
            }
        };

        let currentPath = ["home", "guest"];

        function getNodeByPath(pathArr) {
            let node = fileSystem;
            for (let p of pathArr) {
                if (node.content && node.content[p]) {
                    node = node.content[p];
                } else {
                    return null;
                }
            }
            return node;
        }

        function getCurrentDir() {
            return getNodeByPath(currentPath);
        }

        function getPathString() {
            if (currentPath.length === 1 && currentPath[0] === "root") return "/root";
            if (currentPath[0] === "root") return "/" + currentPath.join("/");
            if (currentPath.length >= 2 && currentPath[0] === "home" && currentPath[1] === currentUser) {
                let sub = currentPath.slice(2);
                return sub.length === 0 ? "~" : "~/" + sub.join("/");
            }
            return "/" + currentPath.join("/");
        }

        function updatePrompt() {
            if (!currentUser) {
                if (authState === "LOGIN_PASS") promptLabel.innerText = "Password:";
                else promptLabel.innerText = "login:";
            } else if (authState === "SUDO_PASS") {
                promptLabel.innerText = `[sudo] password for ${currentUser}:`;
            } else if (authState === "PASSWD_NEW") {
                promptLabel.innerText = `New password:`;
            } else {
                const symbol = currentUser === 'root' ? '#' : '$';
                promptLabel.innerText = `${currentUser}@linux-box:${getPathString()}${symbol}`;
            }
        }

        commandInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const inputVal = commandInput.value;

                // 1. Authentifizierungs-Zustände abfangen
                if (authState === "LOGIN_USER") {
                    tempUser = inputVal.trim();
                    if (users[tempUser]) {
                        terminal.innerHTML += `login: ${tempUser}\n`;
                        authState = "LOGIN_PASS";
                    } else {
                        terminal.innerHTML += `login: ${tempUser}\nLogin incorrect\n`;
                    }
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                if (authState === "LOGIN_PASS") {
                    terminal.innerHTML += `Password: ****\n`;
                    if (users[tempUser].pass === inputVal.trim()) {
                        currentUser = tempUser;
                        currentPath = [...users[currentUser].home];
                        terminal.innerHTML += `Willkommen, ${currentUser}!\nTippe 'help' für Befehle.\n`;
                        authState = "NORMAL";
                    } else {
                        terminal.innerHTML += `Login incorrect\n`;
                        authState = "LOGIN_USER";
                    }
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                if (authState === "SUDO_PASS") {
                    terminal.innerHTML += `[sudo] password: ****\n`;
                    if (users[currentUser].pass === inputVal.trim() || users["root"].pass === inputVal.trim()) {
                        terminal.innerHTML += `Authentifizierung erfolgreich. Führe Befehl aus...\n`;
                        authState = "NORMAL";
                        const cmdParts = pendingSudoCmd.split(' ');
                        pendingSudoCmd = "";
                        executeCommand(cmdParts[0], cmdParts.slice(1), true);
                    } else {
                        terminal.innerHTML += `sudo: 3 incorrect password attempts\n`;
                        authState = "NORMAL";
                        pendingSudoCmd = "";
                    }
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                if (authState === "PASSWD_NEW") {
                    terminal.innerHTML += `New password: ****\n`;
                    const newPass = inputVal.trim();
                    if (newPass.length > 0) {
                        users[currentUser].pass = newPass;
                        terminal.innerHTML += `passwd: password updated successfully\n`;
                    } else {
                        terminal.innerHTML += `passwd: password unchanged\n`;
                    }
                    authState = "NORMAL";
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                // 2. Normaler Terminal-Modus
                const commandLine = inputVal.trim();
                if (commandLine === "") {
                    commandInput.value = '';
                    return;
                }

                const symbol = currentUser === 'root' ? '#' : '$';
                terminal.innerHTML += `\n${currentUser}@linux-box:${getPathString()}${symbol} ${commandLine}\n`;

                const parts = parseCommand(commandLine);
                const cmd = parts[0];
                const args = parts.slice(1);

                executeCommand(cmd, args, false);

                commandInput.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        // Hilfsfunktion zum Parsen (behandelt Anführungszeichen für echo etc.)
        function parseCommand(str) {
            let args = [];
            let current = "";
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                if (char === '"' || char === "'") {
                    inQuotes = !inQuotes;
                } else if (char === ' ' && !inQuotes) {
                    if (current !== "") {
                        args.push(current);
                        current = "";
                    }
                } else {
                    current += char;
                }
            }
            if (current !== "") args.push(current);
            return args;
        }

        function executeCommand(cmd, args, runAsRoot = false) {
            const effectiveUser = runAsRoot ? 'root' : currentUser;

            switch (cmd) {
                case 'help':
                    terminal.innerHTML += `Verfügbare Befehle:\n` +
                                          `  help              - Zeigt diese Hilfe\n` +
                                          `  ls                - Listet Dateien auf\n` +
                                          `  cd <pfad>         - Wechselt das Verzeichnis\n` +
                                          `  cat <datei>       - Zeigt Dateinhalt\n` +
                                          `  touch <datei>     - Erstellt eine leere Datei\n` +
                                          `  echo "t" > <file> - Schreibt Text in Datei\n` +
                                          `  pwd               - Zeigt aktuellen Pfad\n` +
                                          `  whoami            - Zeigt aktuellen Nutzer\n` +
                                          `  passwd            - Ändert eigenes Passwort\n` +
                                          `  useradd <name>    - Erstellt neuen Nutzer (sudo)\n` +
                                          `  sudo <befehl>     - Führt Befehl als root aus\n` +
                                          `  su <user>         - Benutzer wechseln\n` +
                                          `  exit              - Abmelden\n` +
                                          `  clear             - Bildschirm leeren\n`;
                    break;
                case 'ls':
                    const currentDir = getCurrentDir();
                    if (currentDir && currentDir.content) {
                        const files = Object.keys(currentDir.content).join('  ');
                        terminal.innerHTML += files + '\n';
                    }
                    break;
                case 'pwd':
                    terminal.innerHTML += `/${currentPath.join('/')}\n`;
                    break;
                case 'cd':
                    if (args.length === 0 || args[0] === '~') {
                        currentPath = [...users[currentUser].home];
                    } else {
                        let targetPath = [...currentPath];
                        let parts = args[0].split('/');
                        if (args[0].startsWith('/')) {
                            targetPath = [];
                            parts = parts.slice(1);
                        }
                        for (let p of parts) {
                            if (p === '' || p === '.') continue;
                            if (p === '..') {
                                if (targetPath.length > 0) targetPath.pop();
                            } else {
                                targetPath.push(p);
                            }
                        }
                        let node = getNodeByPath(targetPath);
                        if (node && node.type === 'dir') {
                            currentPath = targetPath;
                        } else {
                            terminal.innerHTML += `cd: ${args[0]}: Datei oder Verzeichnis nicht gefunden\n`;
                        }
                    }
                    updatePrompt();
                    break;
                case 'cat':
                    if (args.length === 0) {
                        terminal.innerHTML += `cat: Dateiname fehlt\n`;
                        break;
                    }
                    let dir = getCurrentDir();
                    if (dir.content[args[0]] && dir.content[args[0]].type === 'file') {
                        terminal.innerHTML += dir.content[args[0]].content + '\n';
                    } else {
                        terminal.innerHTML += `cat: ${args[0]}: Datei nicht gefunden\n`;
                    }
                    break;
                case 'touch':
                    if (args.length === 0) {
                        terminal.innerHTML += `touch: Dateiname fehlt\n`;
                        break;
                    }
                    let curDir = getCurrentDir();
                    let fName = args[0];
                    if (!curDir.content[fName]) {
                        curDir.content[fName] = { type: "file", content: "" };
                    }
                    break;
                case 'echo':
                    // Beispiel: echo "Hallo Welt" > datei.txt
                    let redirectIdx = args.indexOf('>');
                    if (redirectIdx !== -1 && args[redirectIdx + 1]) {
                        let textContent = args.slice(0, redirectIdx).join(' ');
                        let targetFile = args[redirectIdx + 1];
                        getCurrentDir().content[targetFile] = { type: "file", content: textContent };
                    } else {
                        terminal.innerHTML += args.join(' ') + '\n';
                    }
                    break;
                case 'whoami':
                    terminal.innerHTML += `${currentUser}\n`;
                    break;
                case 'passwd':
                    authState = "PASSWD_NEW";
                    updatePrompt();
                    break;
                case 'useradd':
                    if (effectiveUser !== 'root') {
                        terminal.innerHTML += `useradd: Permission denied. Nur root (oder sudo) darf Nutzer erstellen.\n`;
                        return;
                    }
                    if (args.length === 0) {
                        terminal.innerHTML += `Verwendung: useradd <benutzername>\n`;
                        return;
                    }
                    let newName = args[0];
                    if (users[newName]) {
                        terminal.innerHTML += `useradd: Benutzer ${newName} existiert bereits.\n`;
                    } else {
                        users[newName] = { pass: "12345", home: ["home", newName], sudo: false };
                        fileSystem.content.home.content[newName] = {
                            type: "dir",
                            content: { "hallo.txt": { type: "file", content: `Willkommen, ${newName}!` } }
                        };
                        terminal.innerHTML += `Benutzer ${newName} erstellt (Standard-Passwort: 12345).\n`;
                    }
                    break;
                case 'sudo':
                    if (args.length === 0) {
                        terminal.innerHTML += `Verwendung: sudo <befehl>\n`;
                        return;
                    }
                    if (users[currentUser].sudo) {
                        // Wenn der Nutzer Admin-Rechte hat, direkt ausführen
                        executeCommand(args[0], args.slice(1), true);
                    } else {
                        // Passwort abfragen für normale User
                        pendingSudoCmd = args.join(' ');
                        authState = "SUDO_PASS";
                        updatePrompt();
                    }
                    break;
                case 'su':
                    let targetUser = args[0] || 'root';
                    if (users[targetUser]) {
                        currentUser = targetUser;
                        currentPath = [...users[currentUser].home];
                        terminal.innerHTML += `Gewechselt zu ${currentUser}\n`;
                        updatePrompt();
                    } else {
                        terminal.innerHTML += `su: Benutzer ${targetUser} existiert nicht\n`;
                    }
                    break;
                case 'exit':
                    currentUser = null;
                    authState = "LOGIN_USER";
                    terminal.innerHTML += `Abgemeldet.\n`;
                    updatePrompt();
                    break;
                case 'clear':
                    terminal.innerHTML = '';
                    break;
                default:
                    terminal.innerHTML += `bash: ${cmd}: Befehl nicht gefunden\n`;
            }
        }

        document.addEventListener('click', () => {
            commandInput.focus();
        });
    </script>

</body>
</html>
