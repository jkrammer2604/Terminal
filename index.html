<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Linux Terminal - 20 Befehle</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #00ff66;
            margin-right: 8px;
            white-space: nowrap;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal">Verbinde mit Supabase Backend...
</div>

    <div class="input-line">
        <span class="prompt" id="prompt-label">login:</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const SUPABASE_URL = 'https://fyklknvrahzaqeksiosq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A3FfZHSipqUHb74clLXjeg_VDhqeu12';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const promptLabel = document.getElementById('prompt-label');

        let currentUser = null;
        let authState = "LOGIN_USER"; 
        let tempUser = "";
        let currentPath = [];

        async function initTerminal() {
            const { error } = await supabaseClient.from('users').select('id').limit(1);
            if (error) {
                terminal.innerHTML += `Fehler: Konnte nicht auf Supabase zugreifen (${error.message}).\n`;
            } else {
                terminal.innerHTML += `Verbindung zu Supabase erfolgreich!\n`;
            }
            terminal.innerHTML += `Standard-Logins: 'root' (Passwort: secret) oder 'guest' (Passwort: guest123)\n\n`;
            updatePrompt();
        }
        initTerminal();

        function getPathString() {
            if (currentPath.length === 0) return "~";
            return "~/" + currentPath.join("/");
        }

        function updatePrompt() {
            if (!currentUser) {
                promptLabel.innerText = authState === "LOGIN_PASS" ? "Password:" : "login:";
            } else {
                const symbol = currentUser === 'root' ? '#' : '$';
                promptLabel.innerText = `${currentUser}@linux-box:${getPathString()}${symbol}`;
            }
        }

        commandInput.addEventListener('keydown', async function(event) {
            if (event.key === 'Enter') {
                const inputVal = commandInput.value.trim();

                if (!currentUser) {
                    if (authState === "LOGIN_USER") {
                        tempUser = inputVal;
                        terminal.innerHTML += `login: ${tempUser}\n`;
                        if (tempUser) authState = "LOGIN_PASS";
                    } else if (authState === "LOGIN_PASS") {
                        terminal.innerHTML += `Password: ****\n`;
                        const { data } = await supabaseClient
                            .from('users')
                            .select('*')
                            .eq('username', tempUser)
                            .single();

                        if (data && data.password === inputVal) {
                            currentUser = data.username;
                            currentPath = [currentUser];
                            authState = "NORMAL";
                            terminal.innerHTML += `Willkommen, ${currentUser}!\nTippe 'help' für alle 20 Befehle.\n`;
                        } else {
                            terminal.innerHTML += `Login incorrect\n`;
                            authState = "LOGIN_USER";
                        }
                        tempUser = "";
                    }
                    commandInput.value = '';
                    updatePrompt();
                    terminal.scrollTop = terminal.scrollHeight;
                    return;
                }

                if (inputVal === "") return;
                const symbol = currentUser === 'root' ? '#' : '$';
                terminal.innerHTML += `\n${currentUser}@linux-box:${getPathString()}${symbol} ${inputVal}\n`;

                // Parsing für Befehle und Argumente (unterstützt Anführungszeichen)
                const parts = parseCommand(inputVal);
                const cmd = parts[0];
                const args = parts.slice(1);

                await executeDbCommand(cmd, args, inputVal);

                commandInput.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        function parseCommand(str) {
            let args = [];
            let current = "";
            let inQuotes = false;
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                if (char === '"' || char === "'") {
                    inQuotes = !inQuotes;
                } else if (char === ' ' && !inQuotes) {
                    if (current !== "") {
                        args.push(current);
                        current = "";
                    }
                } else {
                    current += char;
                }
            }
            if (current !== "") args.push(current);
            return args;
        }

        // --- HIER SIND DIE 20 BEFEHLE IMPLEMENTIERT ---
        async function executeDbCommand(cmd, args, fullLine) {
            const fullPath = currentPath.join('/');

            switch (cmd) {
                // 1. help
                case 'help':
                    terminal.innerHTML += `Verfügbare Befehle (20 Stück):\n` +
                                          `  1. help      - Zeigt diese Hilfe\n` +
                                          `  2. ls        - Dateien auflisten\n` +
                                          `  3. cd        - Verzeichnis wechseln\n` +
                                          `  4. pwd       - Aktueller Pfad\n` +
                                          `  5. touch     - Datei erstellen\n` +
                                          `  6. mkdir     - Ordner erstellen\n` +
                                          `  7. cat       - Datei lesen\n` +
                                          `  8. echo      - Text ausgeben / in Datei schreiben\n` +
                                          `  9. rm        - Datei löschen\n` +
                                          ` 10. clear     - Bildschirm leeren\n` +
                                          ` 11. whoami    - Aktueller Benutzer\n` +
                                          ` 12. date      - Aktuelles Datum & Uhrzeit\n` +
                                          ` 13. uptime    - System-Laufzeit\n` +
                                          ` 14. hostname  - Computername anzeigen\n` +
                                          ` 15. uname     - System-Informationen\n` +
                                          ` 16. history   - Befehls-Historie\n` +
                                          ` 17. passwd    - Passwort ändern\n` +
                                          ` 18. users     - Registrierte Nutzer anzeigen\n` +
                                          ` 19. ping      - Verbindungstest\n` +
                                          ` 20. exit      - Abmelden\n`;
                    break;

                // 2. ls
                case 'ls':
                    let targetDir = fullPath;
                    if (args.length > 0) {
                        targetDir = fullPath + '/' + args[0];
                    }
                    const { data: files } = await supabaseClient
                        .from('terminal_files')
                        .select('name')
                        .eq('path', targetDir);

                    if (files) {
                        terminal.innerHTML += files.map(f => f.name).join('  ') + '\n';
                    }
                    break;

                // 3. cd
                case 'cd':
                    if (args.length === 0 || args[0] === '~') {
                        currentPath = [currentUser];
                    } else if (args[0] === '..') {
                        if (currentPath.length > 1) currentPath.pop();
                    } else {
                        const target = args[0];
                        const { data: folderCheck } = await supabaseClient
                            .from('terminal_files')
                            .select('*')
                            .eq('path', fullPath)
                            .eq('name', target)
                            .eq('type', 'dir')
                            .single();

                        if (folderCheck) {
                            currentPath.push(target);
                        } else {
                            terminal.innerHTML += `cd: ${target}: Verzeichnis nicht gefunden\n`;
                        }
                    }
                    updatePrompt();
                    break;

                // 4. pwd
                case 'pwd':
                    terminal.innerHTML += `/${currentPath.join('/')}\n`;
                    break;

                // 5. touch
                case 'touch':
                    if (args.length === 0) {
                        terminal.innerHTML += `touch: Dateiname fehlt\n`;
                        return;
                    }
                    await supabaseClient.from('terminal_files').insert([{ path: fullPath, name: args[0], type: 'file', content: '' }]);
                    terminal.innerHTML += `Datei '${args[0]}' erstellt.\n`;
                    break;

                // 6. mkdir
                case 'mkdir':
                    if (args.length === 0) {
                        terminal.innerHTML += `mkdir: Ordnername fehlt\n`;
                        return;
                    }
                    await supabaseClient.from('terminal_files').insert([{ path: fullPath, name: args[0], type: 'dir', content: '' }]);
                    terminal.innerHTML += `Verzeichnis '${args[0]}' erstellt.\n`;
                    break;

                // 7. cat
                case 'cat':
                    if (args.length === 0) {
                        terminal.innerHTML += `cat: Dateiname fehlt\n`;
                        return;
                    }
                    const { data: fileData } = await supabaseClient
                        .from('terminal_files')
                        .select('content')
                        .eq('path', fullPath)
                        .eq('name', args[0])
                        .single();

                    if (fileData) {
                        terminal.innerHTML += (fileData.content || '') + '\n';
                    } else {
                        terminal.innerHTML += `cat: ${args[0]}: Datei nicht gefunden\n`;
                    }
                    break;

                // 8. echo (unterstützt auch: echo "text" > datei)
                case 'echo':
                    let redirectIdx = args.indexOf('>');
                    if (redirectIdx !== -1 && args[redirectIdx + 1]) {
                        let textContent = args.slice(0, redirectIdx).join(' ');
                        let targetFile = args[redirectIdx + 1];
                        
                        // Prüfen ob Datei existiert, sonst anlegen oder updaten
                        await supabaseClient.from('terminal_files').upsert([
                            { path: fullPath, name: targetFile, type: 'file', content: textContent }
                        ], { onConflict: 'path,name' });

                        terminal.innerHTML += `Text in '${targetFile}' geschrieben.\n`;
                    } else {
                        terminal.innerHTML += args.join(' ') + '\n';
                    }
                    break;

                // 9. rm
                case 'rm':
                    if (args.length === 0) {
                        terminal.innerHTML += `rm: Dateiname fehlt\n`;
                        return;
                    }
                    await supabaseClient.from('terminal_files').delete().eq('path', fullPath).eq('name', args[0]);
                    terminal.innerHTML += `Eintrag '${args[0]}' gelöscht.\n`;
                    break;

                // 10. clear
                case 'clear':
                    terminal.innerHTML = '';
                    break;

                // 11. whoami
                case 'whoami':
                    terminal.innerHTML += `${currentUser}\n`;
                    break;

                // 12. date
                case 'date':
                    terminal.innerHTML += `${new Date().toUTCString()}\n`;
                    break;

                // 13. uptime
                case 'uptime':
                    terminal.innerHTML += ` 10:17:21 up 42 days,  13:37,  1 user,  load average: 0.00, 0.01, 0.05\n`;
                    break;

                // 14. hostname
                case 'hostname':
                    terminal.innerHTML += `supabase-linux-box\n`;
                    break;

                // 15. uname
                case 'uname':
                    terminal.innerHTML += `Linux supabase-box 6.5.0-generic x86_64 GNU/Linux\n`;
                    break;

                // 16. history
                case 'history':
                    terminal.innerHTML += `  1  help\n  2  ls\n  3  whoami\n  4  ${fullLine}\n`;
                    break;

                // 17. passwd
                case 'passwd':
                    if (args.length > 0) {
                        let newPass = args[0];
                        await supabaseClient.from('users').update({ password: newPass }).eq('username', currentUser);
                        terminal.innerHTML += `Passwort erfolgreich geändert.\n`;
                    } else {
                        terminal.innerHTML += `Verwendung: passwd <neues_passwort>\n`;
                    }
                    break;

                // 18. users
                case 'users':
                    const { data: userList } = await supabaseClient.from('users').select('username');
                    if (userList) {
                        terminal.innerHTML += userList.map(u => u.username).join('  ') + '\n';
                    }
                    break;

                // 19. ping
                case 'ping':
                    const host = args[0] || 'localhost';
                    terminal.innerHTML += `PING ${host} (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.042 ms\n`;
                    break;

                // 20. exit
                case 'exit':
                    currentUser = null;
                    authState = "LOGIN_USER";
                    terminal.innerHTML += `Abgemeldet.\n`;
                    updatePrompt();
                    break;

                default:
                    terminal.innerHTML += `bash: ${cmd}: Befehl nicht gefunden. Tippe 'help' für die Liste.\n`;
            }
        }

        document.addEventListener('click', () => {
            commandInput.focus();
        });
    </script>
</body>
</html>
