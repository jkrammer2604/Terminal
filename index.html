<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Linux Terminal</title>
    <!-- Supabase JS Client per CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
            padding-right: 10px;
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            color: #00ff66;
            margin-right: 8px;
            white-space: nowrap;
        }
        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="terminal">Verbinde mit Supabase Backend...
</div>

    <div class="input-line">
        <span class="prompt" id="prompt-label">login:</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        // --- SUPABASE KONFIGURATION ---
        const SUPABASE_URL = 'https://fyklknvrahzaqeksiosq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_A3FfZHSipqUHb74clLXjeg_VDhqeu12';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const promptLabel = document.getElementById('prompt-label');

        let currentUser = null;
        let authState = "LOGIN_USER"; 
        let tempUser = "";
        let pendingSudoCmd = "";
        let currentPath = ["home", "guest"];

        // Initialisierungstest der Verbindung
        async function checkConnection() {
            try {
                const { data, error } = await supabaseClient.from('users').select('*').limit(1);
                if (error) {
                    terminal.innerHTML += `Hinweis: Konnte keine Verbindung zur 'users'-Tabelle herstellen (${error.message}). Läuft die Datenbank?\n`;
                } else {
                    terminal.innerHTML += `Erfolgreich mit Supabase verbunden!\n`;
                }
            } catch (err) {
                terminal.innerHTML += `Netzwerkfehler bei Supabase-Verbindung.\n`;
            }
            terminal.innerHTML += `Standard-Logins: 'root' oder 'guest'\n\n`;
        }
        checkConnection();

        let currentPathArr = ["home", "guest"];

        // Beispiel für das Laden von Dateien aus Supabase statt lokalem Objekt
        async function fetchFilesFromSupabase(pathStr) {
            const { data, error } = await supabaseClient
                .from('terminal_files')
                .select('*')
                .eq('path', pathStr);
            
            if (error) {
                console.error("Fehler beim Laden:", error);
                return {};
            }
            let filesObj = {};
            data.forEach(row => {
                filesObj[row.name] = { type: row.type, content: row.content };
            });
            return filesObj;
        }

        // Befehlsverarbeitung (Beispielhaft gekürzt auf Kernfunktionen mit DB-Anbindung)
        commandInput.addEventListener('keydown', async function(event) {
            if (event.key === 'Enter') {
                const inputVal = commandInput.value.trim();
                if (inputVal === "") return;

                terminal.innerHTML += `\n> ${inputVal}\n`;
                
                // Hier greifst du nun direkt auf Supabase zu, z.B. für Dateispeicherung via touch/echo:
                if (inputVal.startsWith('touch ')) {
                    let fileName = inputVal.split(' ')[1];
                    // Speichern in Supabase Tabelle 'terminal_files'
                    const { error } = await supabaseClient
                        .from('terminal_files')
                        .insert([{ path: currentPath.join('/'), name: fileName, type: 'file', content: '' }]);
                    
                    if (error) {
                        terminal.innerHTML += `Fehler beim Erstellen in Supabase: ${error.message}\n`;
                    } else {
                        terminal.innerHTML += `Datei ${fileName} in Supabase gespeichert.\n`;
                    }
                } else {
                    terminal.innerHTML += `Befehl ausgeführt (Supabase-Modus aktiv).\n`;
                }

                commandInput.value = '';
                terminal.scrollTop = terminal.scrollHeight;
            }
        });

        document.addEventListener('click', () => {
            commandInput.focus();
        });
    </script>
</body>
</html>
